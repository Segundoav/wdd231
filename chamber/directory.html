<!DOCTYPE html>

<head>

    <meta name="description" content="Chamber of Commerce business directory featuring an interactive members grid and list view toggle.">
    <meta name="author" content="Segundo Alvarez">
    
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <meta property="og:title" content="Chamber of Commerce Business Directory">
    <meta property="og:type" content="website">
    <meta property="og:description" content="Explore local businesses and chamber members in our interactive grid and list directory.">
    <meta property="og:image" content="https://salvarezvilca.github.io/wdd231/images/logo.svg">
    <meta property="og:url" content="https://salvarezvilca.github.io/wdd231/chamber/directory.html">

    <header>

        </div>
        <button id="menu-button" aria-label="Toggle Menu">&#9776;</button>
        <nav id="nav-menu">
            <ul>
                <li><a href="#" class="active">Directory</a></li>
                <li><a href="#">Home</a></li>

        <div class="dev-details">
