<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Explore all insurance plans offered by Alvarez Insurance Broker - Life, Health, Vehicle and SCTR coverage." />
  <meta name="author" content="Your Name" />
  <meta property="og:title" content="Services | Alvarez Insurance Broker" />
  <meta property="og:description" content="Find the best insurance plan for your needs." />
  <meta property="og:image" content="images/hero.webp" />
  <meta property="og:url" content="https://yourusername.github.io/wdd231/finalproject/services.html" />
  <title>Services | Alvarez Insurance Broker</title>
  <link rel="icon" href="favicon.ico" />
  <link rel="stylesheet" href="styles/small.css" />
  <link rel="stylesheet" media="(min-width: 768px)" href="styles/larger.css" />
</head>
<body>

  <header>
    <div class="logo">
      <img src="images/logo.png" alt="Alvarez Insurance Broker Logo" width="50" height="50" loading="lazy" />
      <span>Alvarez Insurance Broker</span>
    </div>
    <nav>
      <button id="menu-btn" aria-label="Toggle navigation menu">&#9776;</button>
      <ul id="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="services.html" class="active">Services</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <!-- Filter Buttons -->
    <section class="filters">
      <h1>Our Insurance Services</h1>
      <div class="filter-buttons">
        <button class="filter-btn active" data-category="all">All</button>
        <button class="filter-btn" data-category="Life">Life</button>
        <button class="filter-btn" data-category="Vehicle">Vehicle</button>
        <button class="filter-btn" data-category="Health">Health</button>
        <button class="filter-btn" data-category="SCTR">SCTR</button>
      </div>
    </section>

    <!-- Insurance Cards (loaded by JS) -->
    <section class="insurance-grid">
      <div id="insurance-cards" class="cards-grid">
        <!-- JS inserts cards here -->
      </div>
    </section>

    <!-- Modal -->
    <dialog id="insurance-modal">
      <div class="modal-content">
        <button id="close-modal" aria-label="Close modal">&times;</button>
        <h2 id="modal-name"></h2>
        <p id="modal-category"></p>
        <p id="modal-description"></p>
        <p id="modal-coverage"></p>
        <p id="modal-price"></p>
      </div>
    </dialog>

  </main>

  <footer>
    <p>&copy; <span id="year"></span> Alvarez Insurance Broker. All rights reserved.</p>
    <p>
      <a href="attributions.html">Attributions</a> |
      <a href="https://youtu.be/REVsVvYhpZo?si=BzThRMm6QUlgWny1" target="_blank">Watch Project Video</a>
    </p>
  </footer>

  <script type="module" src="scripts/services.js"></script>

</body>
</html>
