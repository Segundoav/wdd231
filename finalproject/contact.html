<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Contact Alvarez Insurance Broker for a free quote or consultation on any insurance plan." />
  <meta name="author" content="Your Name" />
  <meta property="og:title" content="Contact | Alvarez Insurance Broker" />
  <meta property="og:description" content="Get in touch with us for personalized insurance advice." />
  <meta property="og:image" content="images/hero.webp" />
  <meta property="og:url" content="https://yourusername.github.io/wdd231/finalproject/contact.html" />
  <title>Contact | Alvarez Insurance Broker</title>
  <link rel="icon" href="favicon.ico" />
  <link rel="stylesheet" href="styles/small.css" />
  <link rel="stylesheet" media="(min-width: 768px)" href="styles/larger.css" />
</head>
<body>

  <header>
    <div class="logo">
      <img src="images/logo.png" alt="Alvarez Insurance Broker Logo" width="50" height="50" loading="lazy" />
      <span>Alvarez Insurance Broker</span>
    </div>
    <nav>
      <button id="menu-btn" aria-label="Toggle navigation menu">&#9776;</button>
      <ul id="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="contact-section">
      <h1>Contact Us</h1>
      <p>Fill out the form below and we will get back to you within 24 hours.</p>

      <form id="contact-form" action="thankyou.html" method="get">
        
        <label for="name">Full Name <span aria-hidden="true">*</span></label>
        <input type="text" id="name" name="name" placeholder="John Doe" required />

        <label for="email">Email Address <span aria-hidden="true">*</span></label>
        <input type="email" id="email" name="email" placeholder="john@example.com" required />

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="+51 999 999 999" />

        <label for="insurance-type">Insurance Type <span aria-hidden="true">*</span></label>
        <select id="insurance-type" name="insurance_type" required>
          <option value="">-- Select an option --</option>
          <option value="life">Life Insurance</option>
          <option value="vehicle">Vehicle Insurance</option>
          <option value="health">Health Insurance</option>
          <option value="sctr">SCTR</option>
        </select>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="4" placeholder="Tell us about your needs..."></textarea>

        <button type="submit">Send Message</button>

      </form>
    </section>
  </main>

  <footer>
    <p>&copy; <span id="year"></span> Alvarez Insurance Broker. All rights reserved.</p>
    <p>
      <a href="attributions.html">Attributions</a> |
      <a href="https://youtu.be/REVsVvYhpZo?si=BzThRMm6QUlgWny1" target="_blank">Watch Project Video</a>
    </p>
  </footer>

  <script type="module" src="scripts/contact.js"></script>

</body>
</html>
